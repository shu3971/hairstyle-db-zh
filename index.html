<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发型图库 · AI 发型参考集 HAIR-DB-01</title>
<style>
:root{--bg:#0f1115;--card:#1a1e26;--fg:#e8ebf0;--muted:#8b93a1;--border:#2a3040;--accent:#4f8cff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--accent)}
header{padding:24px 24px 10px;max-width:1380px;margin:auto}
h1{font-size:25px;font-weight:700}
h1 .tag{font-size:12px;color:var(--muted);font-weight:400;margin-left:10px}
.sub{color:var(--muted);margin-top:4px;font-size:14px}
/* ===== 布局:侧栏 + 主区 ===== */
.layout{max-width:1380px;margin:16px auto 0;padding:0 24px;display:flex;gap:18px;align-items:flex-start}
.sidebar{width:230px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;position:sticky;top:16px}
.main{flex:1;min-width:0}
@media(max-width:860px){.layout{flex-direction:column}.sidebar{width:100%;position:static}}
/* 侧栏筛选组 */
.fgroup{margin-bottom:14px}
.fgroup:last-child{margin-bottom:0}
.fgroup .flabel{font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.5px}
.fopts{display:flex;flex-wrap:wrap;gap:6px}
.fopt{background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:14px;padding:4px 12px;cursor:pointer;font-size:13px;transition:.15s}
.fopt:hover{border-color:var(--accent)}
.fopt.active{background:var(--accent);border-color:var(--accent);color:#fff}
.fcount{font-size:12px;color:var(--muted);margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.reset{margin-top:8px;width:100%;background:transparent;border:1px dashed var(--border);color:var(--muted);border-radius:8px;padding:6px;cursor:pointer;font-size:12px}
.reset:hover{color:var(--fg);border-color:var(--muted)}
/* 工具栏 */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px}
input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--fg);font-size:15px;outline:none}
input:focus{border-color:var(--accent)}
.sort{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--fg);font-size:14px;cursor:pointer;outline:none}
/* Top10 横排 */
.top10{margin-bottom:18px}
.top10 h3{font-size:15px;margin-bottom:10px}
.top10 h3 .fire{color:#ff6b4a}
.top10row{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.topcard{flex:0 0 130px;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s;position:relative}
.topcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.topcard .rank{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.72);color:#ffb347;font-weight:700;font-size:12px;border-radius:6px;padding:2px 7px}
.topcard img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.topcard .tname{padding:6px 8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}
.card .info{padding:9px 11px}
.card .name{font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.card .name .g{color:var(--muted);font-size:12px;flex-shrink:0}
.card .meta{color:var(--muted);font-size:12px;margin-top:2px}
.card .badge{position:absolute;top:7px;right:7px;background:rgba(79,140,255,.92);color:#fff;font-size:11px;border-radius:6px;padding:2px 7px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:60px 0;grid-column:1/-1}
/* 分组标题 */
.group-h{font-size:14px;color:var(--muted);margin:18px 0 10px;font-weight:600}
/* lightbox + 同款聚合 */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:100;align-items:center;justify-content:center;flex-direction:column}
.lb.show{display:flex}
.lb .big{display:flex;gap:14px;max-width:94vw;overflow-x:auto;padding:20px;align-items:center;scrollbar-width:none}
.lb .big::-webkit-scrollbar{display:none}
/* P1-2(二轮): 工具栏在弹窗顶部 */
.lb{flex-direction:column-reverse}
.lb .panel{margin:20px 0}
.lb .big img{max-height:70vh;border-radius:8px;flex:0 0 auto;width:auto}
.lb .big .vthumb{max-height:26vh;min-height:130px;border-radius:8px;cursor:zoom-in;transition:transform .15s}
.lb .big .vthumb:hover{transform:scale(1.04)}
.lb .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:94vw}
.lb a,.lb button{color:var(--fg);background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 14px;text-decoration:none;font-size:14px;cursor:pointer}
.lb a:hover,.lb button:hover{border-color:var(--accent)}
.lb .vartip{color:var(--muted);font-size:13px}
.lb .trylink{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
footer{max-width:1380px;margin:30px auto 40px;padding:0 24px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>发型图库 <span class="tag">HAIR-DB-01 · AI 生成 · 持续更新</span></h1>
  <div class="sub" id="stats">男女发型参考图集 · 纯 AI 生成概念发型 · 点击查看同款全变体 · <a href="./tryon.html">💇 AI 试发型合成台</a></div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="fgroup"><div class="flabel">性别</div><div class="fopts" id="fGender"></div></div>
    <div class="fgroup"><div class="flabel">发长</div><div class="fopts" id="fLen"></div></div>
    <div class="fgroup"><div class="flabel">发色</div><div class="fopts" id="fColor"></div></div>
    <div class="fgroup"><div class="flabel">视角</div><div class="fopts" id="fAngle"></div></div>
    <div class="fcount" id="fcount"></div>
    <button class="reset" onclick="resetFilters()">↺ 重置筛选</button>
  </aside>

  <div class="main">
    <div class="toolbar">
      <div class="search"><input id="q" placeholder="搜索：背头 / 渐变 / bob / curly …"></div>
      <select class="sort" id="sort">
        <option value="style">按发型分组</option>
        <option value="hot">🔥 热门优先</option>
        <option value="new">最新生成</option>
      </select>
    </div>
    <div class="top10" id="top10" style="display:none"></div>
    <div class="top10" id="feature" style="display:none"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="lb" id="lb">
  <div class="big" id="lbBig"></div>
  <div class="panel">
    <span id="lbname" style="font-weight:600"></span>
    <span class="vartip" id="lbVars"></span>
    <a id="lbdl" download>⬇ 下载原图</a>
    <a class="trylink" id="lbTry" href="./tryon.html">💇 用这款试发型</a>
    <button onclick="randomPick()">🎲 随机一款</button>
    <button onclick="lb.classList.remove('show')">✕ 关闭 (Esc)</button>
  </div>
</div>

<footer id="about">
  <div style="max-width:720px;margin:0 auto">
    <b style="color:var(--fg)">关于 HAIR-DB</b> · 本图库全部 801 张发型参考图由 AI 模型 <b>Z-imageT</b>（本地部署于作者 GPU）按统一 prompt 模板生成，无任何真实人物照片，不引用任何外部发型数据集（Figaro/K-Hairstyle 等因许可限制均未使用）。发型分类与中文命名由作者整理。全部代码与图片以 <b>MIT</b> 许可开源：<a href="https://github.com/shu3971/hairstyle-db-zh">GitHub 仓库</a>。反馈/合作请开 issue。
  </div>
</footer>

<script src="data.js"></script>
<script>
/* ===== 常量映射 ===== */
const ZH_LEN={'短':'短发','中':'中发','中长':'中长发','长':'长发'};
const ZH_COLOR={base:'原色',black:'黑色',brown:'棕色',blonde:'金色',silver:'银灰'};
const ZH_ANGLE={'back-45':'45°背面','side':'侧面','top-back':'后上','front':'正面'};
const ZH_G={male:'♂ 男发',female:'♀ 女发'};
/* Top10 人工精选经典款兜底(002M-1: 真实点击次数>0 时覆盖) */
const HOT=['classic-pompadour','wolf-cut','bob','buzz-cut','hush-cut','two-block','mermaid-wave','middle-part','man-bun','butterfly'];
/* 002M-6: 每周精选(主题→款式列表,按周轮换) */
const FEATURES=[
  {week:'2026-W45', theme:'秋冬短发周', styles:['bob','french-bob','pixie','buzz-cut','crew-cut','textured-crop','hush-cut','wet-bob']},
  {week:'2026-W46', theme:'韩系氛围周', styles:['two-block','comma-hair','korean-perm','hush-cut','jelly-perm','curtain-long','korean-pony','mermaid-wave']},
];

/* ===== 002M-1: 点击热度(localStorage, 设备每天每款一次) ===== */
function heat(){
  try{
    const t=new Date().toISOString().slice(0,10);
    const s=JSON.parse(localStorage.getItem('hair_heat')||'{}');
    if(s._day!==t){const keep={};for(const k in s){if(s[k]._d===t)keep[k]=s[k]}s._day=t;localStorage.setItem('hair_heat',JSON.stringify(keep));return keep}
    delete s._day;
    return s;
  }catch(e){return{}}
}
function recordHeat(style){
  const s=heat();
  if(!s[style])s[style]={n:0,_d:new Date().toISOString().slice(0,10)};
  s[style].n++;s[style]._d=new Date().toISOString().slice(0,10);
  delete s._day;
  localStorage.setItem('hair_heat',JSON.stringify(s));
}
function heatCount(style){const s=heat();return (s[style]||{}).n||0}
function hotStyles(){
  /* 002M-1: 有真实点击的款按次数倒序在前,没点击的按 HOT 原顺序在后 */
  const counted=CARDS.map(c=>({key:c.key,style:c.rep.style,n:heatCount(c.rep.style)})).filter(x=>x.n>0);
  counted.sort((a,b)=>b.n-a.n);
  const rest=HOT.filter(s=>!counted.some(x=>x.style===s));
  return [...counted.map(x=>x.style),...rest].slice(0,10);
}

/* ===== 状态 ===== */
let F={g:'all',len:'all',color:'all',angle:'all'};
let curGroup=null; /* lightbox 当前发型组 */

/* ===== 数据派生:同款聚合索引 ===== */
function groupKey(d){return d.g+'|'+d.style}
const GROUPS={};
D.forEach(d=>{
  const k=groupKey(d);
  (GROUPS[k]=GROUPS[k]||[]).push(d);
});
/* 每组代表卡(取 base 色或第一张) + 变体数 */
const CARDS=Object.entries(GROUPS).map(([k,arr])=>{
  arr.sort((a,b)=>(a.color==='base'?-1:1)-(b.color==='base'?-1:1));
  return {key:k,rep:arr[0],n:arr.length,arr};
});

/* ===== 侧栏筛选渲染 ===== */
function buildOpts(id,values,zh,curKey){
  const el=document.getElementById(id);
  const all=[['all','全部']].concat([...new Set(values)].map(v=>[v,zh[v]||v]));
  el.innerHTML=all.map(([v,label])=>
    `<button class="fopt${F[curKey]===v?' active':''}" onclick="F.${curKey}='${v}';renderAll()">${label}</button>`).join('');
}
function renderFilters(){
  const pool=D.filter(d=>(F.g==='all'||d.g===F.g));
  buildOpts('fGender',['male','female'],ZH_G,'g');
  buildOpts('fLen',pool.map(d=>d.len),ZH_LEN,'len');
  buildOpts('fColor',pool.map(d=>d.color),ZH_COLOR,'color');
  buildOpts('fAngle',pool.map(d=>d.angle),ZH_ANGLE,'angle');
  document.getElementById('fcount').textContent=`共 ${D.length} 张 · 符合 ${filtered().length} 张`;
}
function filtered(){
  const kw=q.value.trim().toLowerCase();
  return CARDS.filter(c=>{
    const d=c.rep;
    /* 002M-5: 搜索命中 style/name/tags */
    const hay=(d.style+'/'+d.name+'/'+(d.tags||[]).join('/')).toLowerCase();
    return (F.g==='all'||d.g===F.g)&&(F.len==='all'||d.len===F.len)
      &&(F.color==='all'||c.arr.some(x=>x.color===F.color))
      &&(F.angle==='all'||c.arr.some(x=>x.angle===F.angle))
      &&(!kw||hay.includes(kw));
  });
}
function resetFilters(){F={g:'all',len:'all',color:'all',angle:'all'};renderAll()}

/* ===== Top10 ===== */
function renderTop10(){
  const box=document.getElementById('top10');
  const showIt=F.g==='all'&&F.len==='all'&&F.color==='all'&&F.angle==='all'&&!q.value.trim();
  if(!showIt){box.style.display='none';return}
  box.style.display='block';
  const hot=hotStyles().map(s=>CARDS.find(c=>c.rep.style===s)).filter(Boolean).slice(0,10);
  box.innerHTML=`<h3><span class="fire">🔥</span> 热门 Top 10 <span style="font-size:12px;color:var(--muted);font-weight:400">${heatCount(hot[0]?.rep.style)>0?'· 按真实浏览次数':'· 编辑精选'}</span></h3>
    <div class="top10row">${hot.map((c,i)=>`
      <div class="topcard" onclick="showGroup('${c.key}')">
        <div class="rank">#${i+1}</div>
        <img loading="lazy" src="${c.rep.thumb}" alt="">
        <div class="tname">${c.rep.name}</div>
      </div>`).join('')}</div>`;
  /* P2-7 轮播箭头 */
  const row=document.querySelector('.top10row');
  row.style.scrollbarWidth='none';row.style.scrollBehavior='smooth';
  const h3=box.querySelector('h3');
  const nav=document.createElement('span');
  nav.style.cssText='float:right;cursor:pointer;user-select:none';
  nav.innerHTML='<span id="tpL" style="margin-right:10px">←</span><span id="tpR">→</span>';
  h3.appendChild(nav);
  const step=row.clientWidth*0.6;
  document.getElementById('tpL').onclick=()=>row.scrollBy({left:-step});
  document.getElementById('tpR').onclick=()=>row.scrollBy({left:step});
}

/* ===== 002M-6: 每周精选 ===== */
function renderFeature(){
  const box=document.getElementById('feature');
  if(!box)return;
  const now=new Date();
  const wk='2026-W'+String(Math.ceil(((now-new Date(now.getFullYear(),0,1))/864e5+1)/7)).padStart(2,'0');
  const f=FEATURES.find(x=>x.week===wk)||FEATURES[0];
  const items=f.styles.map(s=>CARDS.find(c=>c.rep.style===s)).filter(Boolean).slice(0,8);
  if(!items.length){box.style.display='none';return}
  box.innerHTML=`<h3>⭐ 本周精选 · ${f.theme} <span style="font-size:12px;color:var(--muted);font-weight:400">${f.week}</span></h3>
    <div class="top10row">${items.map(c=>`
      <div class="topcard" onclick="showGroup('${c.key}')" style="flex-basis:118px">
        <img loading="lazy" src="${c.rep.thumb}" alt="">
        <div class="tname">${c.rep.name}</div>
      </div>`).join('')}</div>`;
}

/* ===== 主网格 ===== */
function renderGrid(){
  const sort=document.getElementById('sort').value;
  let list=filtered();
  if(sort==='new')list=[...list].reverse();
/* P1-3(二轮): 热门优先正序修复 */
  if(sort==='hot')list=[...list].sort((a,b)=>HOT.indexOf(a.rep.style)-HOT.indexOf(b.rep.style));
  document.getElementById('grid').innerHTML=list.length?list.map(c=>{
    const d=c.rep;
    return `<div class="card" onclick="showGroup('${c.key}')">
      ${c.n>1?`<div class="badge">${c.n} 张</div>`:''}
      <img loading="lazy" src="${d.thumb}" alt="${d.name}">
      <div class="info"><div class="name"><span>${d.name}</span><span class="g">${ZH_G[d.g]}</span></div>
      <div class="meta">${ZH_LEN[d.len]||d.len} · ${ZH_COLOR[d.color]||d.color}${c.n>1?` · ${c.n} 变体`:''} · ${d.date||''}${(d.tags||[]).length?`<br><span style="font-size:11px;opacity:.75">${d.tags.map(t=>'#'+t).join(' ')}</span>`:''}</div></div>
    </div>`}).join(''):'<div class="empty">没有匹配的发型，试试重置筛选</div>';
}
function renderAll(){renderFilters();renderTop10();renderGrid()}

/* ===== Lightbox: 同款全变体 ===== */
function showGroup(key){
  /* 002M-1: 记录点击热度(每款每天一次) */
  if(curGroup&&curGroup[0])recordHeat(curGroup[0].style);
  curGroup=GROUPS[key];if(!curGroup)return;
  const d=curGroup[0];
  document.getElementById('lbBig').innerHTML=curGroup.map(x=>
    `<img class="vthumb" src="${x.img}" onclick="zoomOne('${x.img}')" title="${ZH_COLOR[x.color]||x.color} · ${ZH_ANGLE[x.angle]||x.angle}" alt="">`).join('');
  document.getElementById('lbname').textContent=`${d.name}（${ZH_G[d.g]}）`;
  document.getElementById('lbVars').textContent=(curGroup.length>1?`${curGroup.length} 个变体 · 点图放大 · `:'')+`入库 ${d.date||'—'}`;
  document.getElementById('lbdl').href=d.img;
  lb.classList.add('show');
}

/* ===== 事件 ===== */
const grid=document.getElementById('grid'),q=document.getElementById('q'),lb=document.getElementById('lb');
q.oninput=renderAll;
document.getElementById('sort').onchange=renderGrid;
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('show')};

/* P1-4(二轮): Esc 分层关闭——灯箱开着只关灯箱 */
document.onkeydown=e=>{
  if(e.key!=='Escape')return;
  const z=document.getElementById('zoomLayer');
  if(z){z.remove();return}
  if(lb.classList.contains('show'))lb.classList.remove('show');
};

/* 站内二级放大灯箱(P2-8): 点大图不出站 */
function zoomOne(src){
  const z=document.createElement('div');
  z.id='zoomLayer';
  z.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:flex;align-items:center;justify-content:center;cursor:zoom-out';
  z.innerHTML=`<img src="${src}" style="max-width:94vw;max-height:92vh;border-radius:8px">`;
  z.onclick=()=>z.remove();
  document.body.appendChild(z);
}
/* 随机一款(P2-6) + P2-7(二轮): 加保护防竞态报错 */
function randomPick(){
  if(!CARDS||!CARDS.length)return;
  const c=CARDS[Math.floor(Math.random()*CARDS.length)];
  if(c&&c.key)showGroup(c.key);
}

/* ===== P1-4: 计数口径 = 款数+张数 ===== */
const _origRenderFilters=renderFilters;
renderFilters=function(){
  _origRenderFilters();
  const list=filtered();
  const imgs=list.reduce((s,c)=>s+c.n,0);
  document.getElementById('fcount').textContent=`共 ${D.length} 张 · 符合 ${list.length} 款 · ${imgs} 张`;
};

/* ===== P1-5: 重置清搜索框 ===== */
const _origReset=resetFilters;
resetFilters=function(){q.value='';F={g:'all',len:'all',color:'all',angle:'all'};renderAll()};

/* URL 参数直通 tryon(P0-2 出站侧) */
document.getElementById('lbTry').addEventListener('click',e=>{
  if(curGroup&&curGroup[0]){
    e.preventDefault();
    location.href='./tryon.html?style='+encodeURIComponent(curGroup[0].style);
  }
});
/* 002M-3: 首页统计条 */
function renderStats(){
  const el=document.getElementById('stats');
  if(!el)return;
  const t=new Date().toISOString().slice(0,10);
  const today=D.filter(d=>d.date===t).length;
  el.textContent=`📚 全库 ${CARDS.length} 款 / ${D.length} 张`+(today?` · 今日新增 ${today} 张`:' · 数据持续更新');
}
const _origRenderAll=renderAll;
renderAll=function(){_origRenderAll();renderFeature();renderStats()};
renderAll();
</script>
</body>
</html>
